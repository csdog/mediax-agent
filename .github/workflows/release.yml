name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cross-compile CLI binaries
        run: |
          set -eu
          mkdir -p dist/release
          build_one() {
            local target=$1
            local out=$2
            bun build ./src/cli.ts --compile --target="$target" --outfile "dist/release/$out"
          }
          build_one bun-darwin-arm64 mediax-darwin-arm64
          build_one bun-darwin-x64 mediax-darwin-x64
          build_one bun-linux-x64 mediax-linux-x64
          build_one bun-linux-arm64 mediax-linux-arm64
          build_one bun-windows-x64 mediax-windows-x64.exe
          build_one bun-windows-arm64 mediax-windows-arm64.exe
          (
            cd dist/release
            for f in mediax-darwin-arm64 mediax-darwin-x64 mediax-linux-x64 mediax-linux-arm64; do
              chmod +x "$f"
              cp "$f" mediax
              zip -9 "${f}.zip" mediax
              rm mediax
            done
            for f in mediax-windows-x64.exe mediax-windows-arm64.exe; do
              base=${f%.exe}
              cp "$f" mediax.exe
              zip -9 "${base}.zip" mediax.exe
              rm mediax.exe
            done
          )
          rm -rf dist/skills-stage
          mkdir -p dist/skills-stage/mediax
          cp -R skills/mediax/. dist/skills-stage/mediax/
          (
            cd dist/skills-stage
            zip -9r ../release/mediax-skills.zip mediax
          )

      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/mediax-darwin-arm64.zip
            dist/release/mediax-darwin-x64.zip
            dist/release/mediax-linux-x64.zip
            dist/release/mediax-linux-arm64.zip
            dist/release/mediax-windows-x64.zip
            dist/release/mediax-windows-arm64.zip
            dist/release/mediax-skills.zip
          fail_on_unmatched_files: true
